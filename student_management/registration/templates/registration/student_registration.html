<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <h1>Student Registration</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="student_id">Student ID:</label>
        <input id="student_id" type="text" name="student_id" maxlength="20" value="{{ form_values.student_id|default:'' }}" required>

        <br><br>

        <label for="first_name">First Name:</label>
        <input id="first_name" type="text" name="first_name" maxlength="100" value="{{ form_values.first_name|default:'' }}" required>

        <br><br>

        <label for="last_name">Last Name:</label>
        <input id="last_name" type="text" name="last_name" maxlength="100" value="{{ form_values.last_name|default:'' }}" required>

        <br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male" {% if form_values.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if form_values.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if form_values.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <br><br>

        <label for="date_of_birth">Date of Birth:</label>
        <input id="date_of_birth" type="date" name="date_of_birth" value="{{ form_values.date_of_birth|default:'' }}" required>

        <br><br>

        <label for="contact_number">Contact Number:</label>
        <input id="contact_number" type="text" name="contact_number" maxlength="20" value="{{ form_values.contact_number|default:'' }}" required>

        <br><br>

        <button type="submit">Register Student</button>
    </form>
</body>
</html>
